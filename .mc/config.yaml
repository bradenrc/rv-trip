version: 1
name: rv-trip
repo: rv-trip
path: .
board: 'bradenrc/projects/6' # user project — Status field: Todo / Ready to Dev / In Dev / Done
# The board's BUILT-IN Status field (btrip uses a custom "Pipeline"). The engine's flips write
# "In Dev" + "Done" (mc-dev#81 tracks making these configurable), so the board's "In Progress"
# option was renamed "In Dev" at adoption. "Todo" is never written — safe as-is.
board_field: Status
platforms: [web]
# AUTH NOTE: this daemon must run with the bradenrc identity (keyring), NOT GH_TOKEN=btrip-bot —
# the bot can't see user project 6. run_gh's keyring fallback (mc-dev, btrip#1953) covers it as
# long as GH_TOKEN is absent from the daemon's env at `mc up`.
setup_cmd: 'pnpm install --frozen-lockfile' # ship worktree prep before the merged-tree test run
test_cmd: 'pnpm turbo run lint typecheck test' # turbo-cached; mirrors what CI would run
auto_merge: true # walked + trusted before ship → auto-merge when checks pass (btrip recipe)
# Operator-manual board pickup (mc-dev #38): glass Run/Triage buttons are the pickup;
# a bare `mc up` would otherwise poll + auto-fire mock on every Ready-to-Dev card.
poll: false
# Two projects, one machine: btrip holds channel 8789 + glass 8730. rv-trip claims 8790 + 8731.
# channel_port must match MC_CHANNEL_PORT in .mcp.json's `mc` server entry; the glass port is
# `glass_port` below (mc-dev #135) — `mc up/down/status <DIR>` reads it from here, so no call
# needs `--port`, and a bare call can no longer address btrip's daemon. If a bare `mc up` ever
# refuses naming btrip, this line went missing.
channel_port: 8790
glass_port: 8731
# Engine-worktree env provisioning (mc-dev #83/#104): gitignored env files copied 0600
# into every dispatch + ship worktree behind the engine's check-ignore guard. next dev
# reads apps/web/.env.local; root .env feeds the drizzle CLIs (issue-3 walk postmortem).
worktree_env:
  - 'apps/web/.env.local'
  - '.env'

dispatch: orchestrator # worker gates interrupt at dispatch; the runner session resolves them

# Walk gate env — lean v1 (scripts/mc-walk-env.sh): worktree from {branch}, pnpm install,
# `next dev` on an allocated port against the shared docker Postgres, walk.json for the glass.
walk:
  gate: walk
  # mc-dev #152: the engine derives each slice's surfaces from the fold's journaled
  # files_changed through this map (prefix segments, repo-relative). Multi-claim is correct
  # here by design: an apps/web/src/app/api route IS both web and api. packages/core is the
  # shared platform-neutral core — listed under web today (rv has no native walk arm yet);
  # revisit when one exists.
  surface_paths:
    web: ["apps/web", "packages/ui", "packages/core"]
    native: ["apps/mobile"]
    api: ["apps/web/src/app/api"]
    schema: ["packages/db/drizzle", "packages/db/src/schema.ts"]
  web:
    up: 'bash scripts/mc-walk-env.sh standup {issue} --branch {branch}'
    url: 'http://localhost:{port}/' # informational — the live URL comes from .mc/walk/{issue}.json
    down: 'bash scripts/mc-walk-env.sh down --slug {issue}'
  # --- the isolated backend tier (mc-dev #154 · seeded template #155) ---------------------
  # A schema-touching slice gets its OWN Postgres, in its own compose project
  # (`mc-walk-<issue>`), cloned in seconds from a template volume that was migrated + seeded
  # ONCE by `mc walk-template .`. Every other slice stays on the shared docker Postgres and no
  # docker process is ever spawned for it — absent config is this whole feature's off switch,
  # and declaring it changes nothing for the tiers that don't reach it.
  #
  # DB-ONLY, AND THE OMISSION IS THE STATEMENT. rv-trip's api routes live INSIDE the next app
  # (apps/web/src/app/api), so there is no api container to isolate — the web arm's `up`
  # already restands that code at the slice's commit. Declaring `db` and NOT `api` is how the
  # engine is told so (walk_compose._isolation): an `api` surface then leaves the tier
  # `shared`, instead of raising a refusal on every route-handler slice we ship, and only a
  # `schema` surface raises the tier to a database of our own.
  compose:
    # Distinct prefix: the template volume is <prefix>-template, and btrip adopts the same
    # engine on this machine — the default `mc-walk` would collide the two templates.
    project_prefix: mc-walk-rv
    db_port_base: 15500 # + (issue % port_span=100) → 15500-15599; btrip holds no span here
    # HOST-SHAPED, and legal ONLY on the api-less shape: with no `api` service, nothing in the
    # generated compose file consumes this DSN — the thing that has to be pointed at the
    # walk's database is a HOST process (`next dev`). So the engine resolves `{db_port}` late
    # and hands the assembled DSN to scripts/mc-walk-env.sh as MC_WALK_DB_URL. Adding an `api`
    # service later would make this a LOAD-TIME error, by design: that DSN is rendered into
    # the compose file in one substitution pass, so the placeholder would land verbatim in a
    # container's DATABASE_URL.
    walk_db_url: 'postgres://rvtrip:rvtrip@localhost:{db_port}/rvtrip'
    db:
      image: postgres:18-alpine # the same major the repo-root docker-compose.yml runs
      environment:
        POSTGRES_USER: rvtrip
        POSTGRES_PASSWORD: rvtrip
        POSTGRES_DB: rvtrip
      ports: ['{db_port}:5432']
      # PG18+ images want the mount at /var/lib/postgresql — the data lives in a
      # version-specific subdir UNDER it — not /var/lib/postgresql/data. Same mount as
      # docker-compose.yml, and the path the seeded template's clone fills.
      volumes: ['walk_db:/var/lib/postgresql']
      # TCP, never the bare-socket `pg_isready -U rvtrip` docker-compose.yml uses. The
      # postgres image runs a TEMPORARY server during initdb with `listen_addresses=''`, so a
      # socket check reports ready on a server that is about to be shut down and replaced —
      # and on a FRESH template volume that window is exactly when the seed verbs fire.
      healthcheck:
        test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U rvtrip -d rvtrip']
        interval: 5s
        timeout: 5s
        retries: 10
    volumes:
      walk_db: {} # compose scopes it per project; the engine clones the template into it
      # The seed container's own workspace — the reason the host tree can be mounted
      # READ-ONLY below. A side volume of the throwaway template project only: `mc
      # walk-template`'s teardown (`down -v`) reaps it, and it never reaches a walk's compose
      # file because only the `db` service is rendered there.
      seed_src: {}
    seed:
      volume: walk_db
      service:
        image: node:24-alpine # the repo's own major — .nvmrc 24, package.json engines >=20
        working_dir: /src
        volumes:
          # READ-ONLY, then copied. `{worktree}` here is the SOURCE TREE the template is built
          # from — the engine's own clone. A writable bind would have `pnpm install` replace
          # that clone's node_modules with linux binaries (drizzle-kit and tsx ship a native
          # esbuild; the host's darwin build cannot execute here), breaking the machine's own
          # dev tree. The copy also has to SURVIVE BETWEEN VERBS: each verb is its own
          # `docker compose run --rm` container, so an anonymous volume would be discarded
          # with the first one and the install would be gone by the migrate.
          - '{worktree}:/host:ro'
          - 'seed_src:/src'
        environment:
          # IN-NETWORK AND HARD-CODED, not `{db_url}`: on this api-less shape `{db_url}` is
          # `walk_db_url`, written from a host process's point of view and carrying a
          # `{db_port}` the TEMPLATE render has nothing to resolve (a template has no issue),
          # so it would arrive here as `@localhost:{db_port}/`. The template project's db
          # service is named `db`, and that is the spelling that resolves.
          DATABASE_URL: 'postgres://rvtrip:rvtrip@db:5432/rvtrip'
          # drizzle.config.ts and baseline.ts both PREFER DATABASE_URL_UNPOOLED (Neon's DDL
          # connection). Pinned to the same in-network db so a stray one can never point the
          # template build's migrations at a real database.
          DATABASE_URL_UNPOOLED: 'postgres://rvtrip:rvtrip@db:5432/rvtrip'
          # ON THE PERSISTED VOLUME, so corepack downloads pnpm 9.12.0 (package.json's
          # `packageManager` pin) ONCE. Its default home is under /root, which is image-local
          # — and every verb below is its own `run --rm` container, so each one would pay the
          # download again.
          COREPACK_HOME: /src/.corepack
        depends_on:
          db:
            condition: service_healthy
      run:
        # A clean tree, then a clean install. `tar` rather than `cp -a` for the excludes, and
        # each one is load-bearing: node_modules (host binaries), .git (nothing here reads it
        # and it is the biggest thing in the tree), and `.env*` — drizzle.config.ts reads
        # ../../.env and would prefer a Neon `DATABASE_URL_UNPOOLED` out of it. busybox tar
        # supports `--exclude` (verified on node:24-alpine).
        # `.claude` is the walk-worktree home — 11 live trees incl. a CocoaPods forest;
        # measured: without this exclude the DEFAULT build (source = the engine clone)
        # streams 3.0 GB through the ro-bind; with it, 27.7 MB. `.mc` is registry/journal.
        - "tar -C /host -cf - --exclude=node_modules --exclude=.git --exclude='.env*' --exclude=.next --exclude=.turbo --exclude=pgdata --exclude=.claude --exclude=.mc . | tar -C /src -xf -"
        # `corepack pnpm` on EVERY verb, not `corepack enable` once: enabling writes shims
        # into the image's /usr/local/bin, and each verb is its own `run --rm` container, so
        # verb 3 met `sh: pnpm: not found` (measured, not guessed). Filtered on purpose —
        # `@rv-trip/db...` is the db package PLUS its dependencies, which is everything
        # migrate + seed touch; a full workspace install would also build apps/mobile's expo
        # tree for no benefit here.
        - 'corepack pnpm install --frozen-lockfile --filter "@rv-trip/db..."'
        # THE REAL VERBS — root package.json's `db:migrate` / `db:seed`, spelled as the
        # filters they delegate to. CI runs this same pair against an empty database
        # (.github/workflows/ci.yml, "db · migrate · seed · drift check"), and the seed is
        # keyless (packages/db/src/seed.ts mints `dev-household`/`dev-user`), so a template
        # built from it needs no Clerk key and no re-login.
        - 'corepack pnpm --filter @rv-trip/db migrate'
        - 'corepack pnpm --filter @rv-trip/db seed'
      # WHAT THE TEMPLATE IS STAMPED WITH: file CONTENT under these prefixes, hashed with the
      # seed spec itself, so a template built before a migration or a seed edit reads STALE
      # rather than silently serving the wrong schema — or the wrong data, which is the half a
      # migration head would miss. Superset of `surface_paths.schema` on purpose: a seed.ts
      # edit does not need to raise a slice's TIER, but it does make this volume stale.
      stamp_paths:
        - packages/db/drizzle
        - packages/db/src/schema.ts
        - packages/db/src/seed.ts

# --- Stage agents (engine-native .md briefs, dispatched as mc-dev workers) ---
# Same seven-agent shape as btrip. Design authority here is ds-bundle/ (tokens + guidelines +
# components, design-sync-managed) — briefs point at it, never invent outside it.
agents:
  mock:
    md: .mc/agents/mock.md
    tools: [Read, Write, Edit, Bash, Glob, Grep]
    model: claude-opus-5
    native: true
  wireframe:
    md: .mc/agents/wireframe.md
    tools: [Read, Write, Edit, Bash, Glob, Grep]
    model: claude-opus-5
    native: true
    prior_artifact: true
  vet:
    md: .mc/agents/vet.md
    tools: [Read, Bash, Grep, Glob, Write]
    model: claude-opus-5
    native: true
    reviewer: true
    prior_artifact: true
  qa:
    md: .mc/agents/qa.md
    tools: [Read, Bash, Grep, Glob, Write]
    model: claude-opus-5
    native: true
    reviewer: true
    prior_artifact: true
    require_paths: # QA runs only when the dev diff touches a walk-blind surface; tune freely.
      - 'packages/core/**' # domain logic — no pixels to walk
      - 'packages/db/**' # schema + queries + migrations
  dev:
    md: .mc/agents/dev.md
    tools: [Read, Write, Edit, Bash, Glob, Grep]
    model: claude-opus-5
    native: true
    code: true
    prior_artifact: true
  triage:
    md: .mc/agents/triage.md # glass multi-select → partition proposal; read-only meta-op
    tools: [Read, Grep, Glob, Bash]
    model: claude-opus-5
  fixup:
    md: .mc/agents/fixup.md # ship-failure triage: re-land a walked branch on moved main
    tools: [Read, Write, Edit, Bash, Glob, Grep]
    model: claude-opus-5
    native: true
    code: true

pipeline:
  entry: mock
  # CI concurrency cap (mc-dev #36): bound overlapping full-suite runs. rv-trip's suite is
  # light today; revisit alongside CI_JOBS if suites grow heavy like btrip's.
  ci_gates: [dev, qa, fixup]
  max_ci_dispatches: 2
  gates:
    - id: mock
      kind: worker
      agent: mock
      on_pass: survey
      on_fail: mock
    - id: survey
      kind: human
      on_pass: wireframe
      on_fail: mock
    - id: wireframe
      kind: worker
      agent: wireframe
      # signoff RETIRED (2026-09-15): 176 approvals / 3 rejections (all pre-Aug-10, all
      # survey-shaped) = a rubber stamp costing ~375h parked. The survey is the design
      # decision point; vet pressure-tests the wireframe against it mechanically; the walk
      # is the human gate that earns its keep (9% catch rate). reset_to_gate re-enters
      # wireframe if a pixel look is ever wanted.
      on_pass: vet
      on_fail: mock
    - id: vet
      kind: worker
      agent: vet
      on_pass: dev
      on_fail: dev # findings ride to dev; vet sets route:mock only for a real design decision
    - id: dev
      kind: worker
      agent: dev
      iterable: true # epics walk plan.json items here — inert for non-epic issues
      on_pass: qa
      on_fail: dev
    - id: qa
      kind: worker
      agent: qa
      on_pass: walk
      on_fail: dev
    - id: walk
      kind: human
      on_pass: ship
      on_fail: dev
    - id: fixup
      kind: worker
      agent: fixup
      on_pass: ship # the walk approved the FEATURE; fixup only reconciles it with moved main
      on_fail: dev
    - id: ship
      kind: worker
      agent: ship
      on_pass: null
      on_fail: fixup # classified ship blocker → the triage ladder, not straight to dev

# Fleet-report era markers (mc-dev #65) — append-only; new optimization → new entry.
eras:
  - date: '2026-08-31'
    label: 'Pipeline adoption' # rv-trip onboards the full mc-dev recipe (this commit)
