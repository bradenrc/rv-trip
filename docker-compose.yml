services:
  postgres:
    image: postgres:18-alpine
    container_name: rv-trip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rvtrip
      POSTGRES_PASSWORD: rvtrip
      POSTGRES_DB: rvtrip
    ports:
      - "5433:5432"
    volumes:
      # PG18+ images want the mount at /var/lib/postgresql (data goes in a
      # version-specific subdir), not /var/lib/postgresql/data.
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rvtrip -d rvtrip"]
      interval: 5s
      timeout: 5s
      retries: 5
