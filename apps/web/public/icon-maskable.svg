<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" role="img" aria-label="RV Trip Hub">
  <!-- The same mark as app/icon.svg, inset to Android's 80% safe zone: the navy
       bleeds to every edge (the adaptive mask supplies the shape, so no rx here)
       and the Compass is drawn at 80% of its size-[19px] so no mask can clip it. -->
  <rect width="32" height="32" fill="#020617"/>
  <!-- 19 * 0.8 = 15.2; 15.2/24 = 0.63333333 scale; (32 - 15.2) / 2 = 8.4 centres it. -->
  <g transform="translate(8.4 8.4) scale(0.63333333)" fill="#34d399" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>
  </g>
</svg>
