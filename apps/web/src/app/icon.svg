<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" role="img" aria-label="RV Trip Hub">
  <!-- The masthead mark, 1:1 with Nav.tsx:24-27 — a size-8 (32px) rounded-rv-md
       (6px, packages/ui/styles/entry.css:25) bg-rv-navy (#020617) square holding
       lucide's Compass at size-[19px], text-rv-green-on-dark (#34d399),
       fill="currentColor" strokeWidth={1.5}. An SVG cannot carry an rv-* token,
       so both hexes are written here with their provenance. -->
